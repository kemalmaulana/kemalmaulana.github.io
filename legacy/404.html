<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Kemal Maulana</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FFFFFF;
      color: #0A0A0A;
      font-family: 'Space Mono', 'JetBrains Mono', monospace;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .code {
      display: inline-block;
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      background: #DFE104;
      color: #0A0A0A;
      padding: 0 24px;
      border: 3px solid #0A0A0A;
      box-shadow: 8px 8px 0 #0A0A0A;
      margin-bottom: 32px;
    }
    p {
      color: #4B4B4B;
      margin-bottom: 32px;
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .mono { font-size: 12px; color: #4B4B4B; margin-bottom: 8px; letter-spacing: 0.08em; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      background: #0A0A0A;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      border: 3px solid #0A0A0A;
      box-shadow: 5px 5px 0 #DFE104;
      transition: background 90ms linear, color 90ms linear, transform 90ms linear, box-shadow 90ms linear;
    }
    a:hover { background: #DFE104; color: #0A0A0A; transform: translate(5px, 5px); box-shadow: 0 0 0 0 transparent; }
  </style>
</head>
<body>
  <div>
    <p class="mono">ERR_PAGE_NOT_FOUND</p>
    <div class="code">404</div>
    <p>This page wandered off the map.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Kemal Maulana</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #02020a;
      color: #edeef2;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #818cf8, #6366f1, #06d6a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    p {
      color: #888ca0;
      margin-bottom: 32px;
      font-size: 1.05rem;
    }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4a4d5e; margin-bottom: 8px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(99,102,241,0.25);
      transition: background 0.2s, transform 0.15s;
    }
    a:hover { background: #5254cc; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <p class="mono">ERR_PAGE_NOT_FOUND</p>
    <div class="code">404</div>
    <p>This page wandered off the map.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
